# CI (CLAUDE.md §11): import, run GUT, export a signed debug APK (arm64),
# publish it to the rolling "dev-latest" release.
#
# Every push to any branch builds, and so does every pull request (opened,
# reopened, or pushed to). Owner: "the apk needs to be built with every single
# pr. Period." (2026-11-11) and "I need a damn apk built with GitHub actions
# every time" (2026-11-12). Failing tests turn the run red but never stop the
# APK. dev-latest always holds the newest build; its title names the time and
# commit, its notes the branch and whether the tests passed.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

# One dev-latest: a newer build cancels an older one still running.
concurrency:
  group: dev-latest
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request builds its branch as it is, not GitHub's trial merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/godot" "$tpl_dir"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl_dir/"
          ls -la "$tpl_dir"

      - name: Put Godot on PATH
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          "$HOME/godot/godot" --headless --version

      - name: Import project
        run: timeout 600 godot --headless --import

      - name: Validate scripts and run GUT
        id: tests
        # A failing test is reported (the run goes red at the end) but never stops the APK.
        continue-on-error: true
        run: tools/check.sh

      - name: Configure Android SDK and signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          java_home="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$java_home"
          EOT
          keystore="$RUNNER_TEMP/graft.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$keystore"
            alias="$KEYSTORE_ALIAS"; password="$KEYSTORE_PASSWORD"
          else
            # A fixed debug key committed to the repo, so every build has the same
            # signature and installs over the last one. Debug builds only: never
            # use it for a release. (A new key per run made Android refuse every
            # update: "package appears to be invalid", 2026-11-07.)
            echo "ANDROID_KEYSTORE_* secrets are not set. Signing with the committed debug key (tools/android/graft-debug.keystore)."
            cp tools/android/graft-debug.keystore "$keystore"
            alias=graftdebug; password=graftdebug
          fi
          "$java_home/bin/keytool" -list -v -keystore "$keystore" -storepass "$password" -alias "$alias" \
            | grep -E "^\s*SHA256:" | sed 's/^/Signing certificate /'
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$alias"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$password"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Export debug APK (arm64)
        run: |
          set -euo pipefail
          mkdir -p build
          # Explicit import first: headless exports have dropped resources in past versions.
          timeout 600 godot --headless --import
          timeout 900 godot --headless --export-debug "Android" build/graft-debug.apk 2>&1 | tee build/export.log
          test -s build/graft-debug.apk
          ls -la build/graft-debug.apk

      - name: Shrink, re-sign and verify APK
        run: |
          set -euo pipefail
          # Godot stores .ctex textures uncompressed; deflating them took the APK
          # from 390 MB to 211 MB (2026-11-11). The 390 MB download failed on the
          # phone with "There was a problem parsing the package".
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "Using build-tools at $bt"
          python3 -I tools/android/shrink_apk.py build/graft-debug.apk build/repacked.apk
          "$bt/zipalign" -p -f 4 build/repacked.apk build/aligned.apk
          "$bt/apksigner" sign --ks "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" --ks-pass env:GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            --ks-key-alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" --out build/graft-debug.apk build/aligned.apk
          rm build/repacked.apk build/aligned.apk
          "$bt/zipalign" -c -p 4 build/graft-debug.apk
          "$bt/apksigner" verify --verbose --print-certs build/graft-debug.apk | grep -vi "warning"
          # What the phone's package installer parses first.
          "$bt/aapt2" dump badging build/graft-debug.apk | sed -n 1,4p
          ls -la build/graft-debug.apk
          echo "APK_BYTES=$(stat -c %s build/graft-debug.apk)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: graft-debug-apk
          path: |
            build/graft-debug.apk
            build/export.log
          retention-days: 14

      - name: Publish to dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          short="${BUILD_SHA::7}"
          when="$(date -u '+%Y-%m-%d %H:%M UTC')"
          subject="$(git log -1 --format=%s "$BUILD_SHA")"
          tests="${{ steps.tests.outcome == 'success' && 'All tests passed.' || 'WARNING: some tests failed (see the run).' }}"
          notes="Built ${when} from branch ${BUILD_BRANCH} @ ${short}: ${subject}
          ${tests}
          CI run #${{ github.run_number }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          Install graft-debug.apk on the phone. Needs a controller.
          Size: $((APK_BYTES / 1000000)) MB (${APK_BYTES} bytes). If the downloaded file is smaller, the download was cut off: download it again."
          gh release delete dev-latest --cleanup-tag --yes 2>/dev/null || true
          sleep 3
          gh release create dev-latest build/graft-debug.apk \
            --prerelease --target "$BUILD_SHA" \
            --title "GRAFT ${when} (${short})" --notes "$notes"

      - name: Report failing tests
        if: steps.tests.outcome != 'success'
        run: |
          echo "::error::Tests failed. The APK was still built and published; see 'Validate scripts and run GUT' above."
          exit 1
